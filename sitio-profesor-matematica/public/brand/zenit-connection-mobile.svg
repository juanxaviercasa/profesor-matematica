<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940" role="img" aria-labelledby="title description">
<title id="title">Comprender es conectar: función cuadrática</title>
<desc id="description">Ejemplo de función cuadrática con fórmula, gráfica, raíces uno y tres, y vértice en dos menos uno.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241b4b"/><stop offset="1" stop-color="#19152f"/></linearGradient>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" stroke="#d9cdef" stroke-opacity=".09" fill="none"/></pattern>
  <clipPath id="plot-clip"><rect x="25" y="63" width="518" height="264" rx="14"/></clipPath>
</defs>
<rect width="640" height="940" rx="34" fill="url(#background)"/>
<rect x="18" y="18" width="604" height="904" rx="26" fill="url(#grid)" stroke="#65528f" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="41" y="72" font-size="25" font-weight="800" letter-spacing="2" fill="#e8bc71">SISTEMA ZÉNIT</text>
  <text x="41" y="128" font-size="45" font-weight="800" fill="#fffefa">COMPRENDER</text>
  <text x="41" y="181" font-size="45" font-weight="800" fill="#fffefa">ES CONECTAR</text>
  <g transform="translate(36 216)">
    <rect width="568" height="150" rx="22" fill="#f1edff"/>
    <text x="29" y="41" fill="#4b2a96" font-size="24" font-weight="800" letter-spacing="1">01 · EXPRESIÓN</text>
    <text x="29" y="103" fill="#241b4b" font-size="43" font-family="Georgia,Times New Roman,serif" font-style="italic">f(x) = x² − 4x + 3</text>
    <text x="29" y="133" fill="#615b76" font-size="27">También: (x − 2)² − 1</text>
  </g>
  <path d="M320 369V389m-10-11 10 11 10-11" stroke="#e8bc71" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <g transform="translate(36 397)">
