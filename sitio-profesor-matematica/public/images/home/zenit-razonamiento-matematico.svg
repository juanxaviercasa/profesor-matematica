<rect x="379" y="148" width="82" height="88" rx="16" fill="#D4C3F5"/><text x="420" y="205">16</text>
<rect x="477" y="148" width="72" height="88" rx="16" fill="#F4E6C8"/><text x="513" y="205" fill="#73511D">?</text>
