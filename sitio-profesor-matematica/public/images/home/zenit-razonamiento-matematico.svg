<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Razonamiento Matemático</title><desc id="desc">Patrón numérico de duplicación que invita a identificar el siguiente término</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFAFF"/><stop offset=".55" stop-color="#EAE2FD"/><stop offset="1" stop-color="#CEC0F3"/></linearGradient>
<radialGradient id="glow" cx=".7" cy=".3" r=".7"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6840C5"/><stop offset="1" stop-color="#301F70"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#3E2B83" flood-opacity=".12"/></filter>
</defs>
<rect width="640" height="390" fill="url(#bg)"/><rect width="640" height="390" fill="url(#glow)"/>
<circle cx="545" cy="60" r="155" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="1.5"/>
<circle cx="558" cy="41" r="89" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.5"/>

<g filter="url(#shadow)"><rect x="62" y="84" width="516" height="221" rx="29" fill="#FFFFFF" fill-opacity=".82"/></g>
<g font-family="Georgia,serif" font-size="45" text-anchor="middle" fill="#332461">
<rect x="94" y="148" width="79" height="88" rx="16" fill="#EFE9FC"/><text x="134" y="205">2</text>
<rect x="189" y="148" width="79" height="88" rx="16" fill="#E6DEFB"/><text x="228" y="205">4</text>
