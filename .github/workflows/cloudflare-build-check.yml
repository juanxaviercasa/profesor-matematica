name: Validar despliegue Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'sitio-profesor-matematica/**'
      - 'package.json'
      - '.github/workflows/cloudflare-build-check.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: sitio-profesor-matematica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sitio-profesor-matematica/package-lock.json
      - name: Instalar dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Validar sistema visual y SEO
        run: npm run check:design
      - name: Validar las páginas públicas
        run: npm run check:public
      - name: Validar evaluación y navegación educativa
        run: npm run check:learning
      - name: Validar conversiones y contacto
        run: npm run check:conversion
      - name: Validar indexación, canónicas y presupuesto de datos
        run: npm run check:seo
      - name: Compilar Vinext y verificar Worker SSR
        run: npm run build
      - name: Verificar salida reproducible
        run: npm run check:cloudflare
      - name: Ensayar empaquetado sin publicar
        run: npm run deploy -- --dry-run
