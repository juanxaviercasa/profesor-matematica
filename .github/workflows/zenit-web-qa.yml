name: Zénit - Auditoría visual y funcional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitio-profesor-matematica/**'
      - '.github/workflows/zenit-web-qa.yml'

permissions:
  contents: read

concurrency:
  group: zenit-web-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-qa:
    name: Navegación, responsive, capturas y accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sitio-profesor-matematica
    steps:
      - name: Obtener código privado
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sitio-profesor-matematica/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci --no-audit --no-fund

      - name: Verificar diseño, legibilidad, textos públicos y SEO
        id: static_checks
        continue-on-error: true
        run: |
          failed=0
          for task in check:design check:readability check:public-copy check:seo; do
            echo "Ejecutando $task"
            npm run "$task" || failed=1
          done
          echo "ZENIT_STATIC_FAILED=$failed" >> "$GITHUB_ENV"
          exit "$failed"

      - name: Compilar versión de producción
        run: npm run build

      - name: Instalar herramientas del navegador (sin modificar package-lock)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright axe-core
          npx playwright install --with-deps chromium

      - name: Iniciar Worker compilado localmente
        run: |
          nohup npm run start > /tmp/zenit-worker-qa.log 2>&1 &
          echo $! > /tmp/zenit-worker-qa.pid
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8787/ > /dev/null; then
              echo "Worker listo para QA"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/zenit-worker-qa.log
          exit 1

      - name: Probar rutas, clics, pantallas y accesibilidad
        id: general_qa
        continue-on-error: true
        env:
          QA_BASE_URL: http://127.0.0.1:8787
          QA_OUTPUT_DIR: .qa-output
        run: node scripts/qa-browser.mjs

      - name: Probar controles de simuladores y exámenes
        id: pedagogy_qa
        continue-on-error: true
        env:
          QA_BASE_URL: http://127.0.0.1:8787
          QA_OUTPUT_DIR: .qa-output
        run: node scripts/qa-pedagogy-interactive.mjs

      - name: Guardar capturas e informe aunque fallen las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenit-qa-${{ github.run_number }}
          path: |
            sitio-profesor-matematica/.qa-output/
            /tmp/zenit-worker-qa.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Verificar resultado de controles estáticos
        if: always()
        run: |
          if [ "${{ steps.general_qa.outcome }}" != "success" ] || [ "${{ steps.pedagogy_qa.outcome }}" != "success" ]; then
            echo "Las comprobaciones de navegación o pedagogía detectaron incidencias"
            exit 1
          fi
          if [ "${ZENIT_STATIC_FAILED:-0}" != "0" ]; then
            echo "Hay comprobaciones estáticas que requieren corrección"
            exit 1
          fi
